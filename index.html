<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
    }
    canvas {
      border: 1px solid #333;
      max-width: 100%;
      cursor: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = 600;
    canvas.height = 400;
    
    let imageData;
    let activePixels = new Set();
    let animationFrame;
    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;
    
    // Track mouse position
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    });
    
    // Right click handler for image change
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      loadRandomImage();
    });

    function getRandomImageNumber() {
      // Assuming we have images numbered 1.png to 5.png
      return Math.floor(Math.random() * 5) + 1;
    }

    function loadRandomImage() {
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.src = `${getRandomImageNumber()}.png`;
      
      img.onload = function() {
        resetCanvas(img);
        startGrowth();
      };
      
      img.onerror = function() {
        // If image fails to load, try another one
        loadRandomImage();
      };
    }

    function resetCanvas(image) {
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const x = (canvas.width - image.width) / 2;
      const y = (canvas.height - image.height) / 2;
      ctx.drawImage(image, x, y);
      
      imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      activePixels.clear();
      const data = imageData.data;
      
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const idx = (y * canvas.width + x) * 4;
          if (data[idx + 3] > 0) {
            if (isEdgePixel(x, y, data)) {
              activePixels.add(`${x},${y}`);
            }
          }
        }
      }
    }

    function isEdgePixel(x, y, data) {
      const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      
      for (const [dx, dy] of directions) {
        const nx = x + dx;
        const ny = y + dy;
        
        if (nx >= 0 && nx < canvas.width && ny >= 0 && ny < canvas.height) {
          const idx = (ny * canvas.width + nx) * 4;
          if (data[idx + 3] === 0) {
            return true;
          }
        }
      }
      return false;
    }

    function startGrowth() {
      growthAnimation();
    }

    function getGrowthDirection(x, y) {
      const dx = mouseX - x;
      const dy = mouseY - y;
      const angle = Math.atan2(dy, dx);
      const randomFactor = 0.5;
      return angle + (Math.random() - 0.5) * randomFactor;
    }

    function growthAnimation() {
      const newActivePixels = new Set();
      const data = imageData.data;
      
      for (const pixelKey of activePixels) {
        const [x, y] = pixelKey.split(',').map(Number);
        const idx = (y * canvas.width + x) * 4;
        
        if (Math.random() < 0.4) {
          const growthAngle = getGrowthDirection(x, y);
          const distance = 1 + Math.random();
          
          const nx = Math.floor(x + Math.cos(growthAngle) * distance);
          const ny = Math.floor(y + Math.sin(growthAngle) * distance);
          
          if (nx >= 0 && nx < canvas.width && ny >= 0 && ny < canvas.height) {
            const newIdx = (ny * canvas.width + nx) * 4;
            
            if (data[newIdx + 3] === 0) {
              data[newIdx] = data[idx];
              data[newIdx + 1] = data[idx + 1];
              data[newIdx + 2] = data[idx + 2];
              data[newIdx + 3] = 255;
              
              newActivePixels.add(`${nx},${ny}`);
            }
          }
        }
      }
      
      for (const pixel of newActivePixels) {
        activePixels.add(pixel);
      }
      
      ctx.putImageData(imageData, 0, 0);
      
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.stroke();
      
      animationFrame = requestAnimationFrame(growthAnimation);
    }

    // Start with first random image
    loadRandomImage();
  </script>
</body>
</html>
