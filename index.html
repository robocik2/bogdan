<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      min-height: 100vh;
      background: #FF4500;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    .turntable-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .turntable {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      cursor: grab;
      overflow: visible;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .turntable:active {
      cursor: grabbing;
    }

    .vinyl-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      user-drag: none;
      -webkit-touch-callout: none;
    }

    .vinyl-img.spinning {
      animation: spin 8s linear infinite;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    button {
      width: 100px;
      height: 100px;
      background: #ff6b35;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button.play {
      clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
    }

    button.pause {
      clip-path: polygon(0% 0%, 35% 0%, 35% 100%, 0% 100%, 65% 0%, 100% 0%, 100% 100%, 65% 100%);
    }

    button:hover {
      background: #ff824d;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script> <!-- Załaduj YouTube API -->
</head>
<body>
  <div class="turntable-container">
    <div class="turntable">
      <img src="a man.png" alt="Vinyl" class="vinyl-img" draggable="false">
    </div>
    <div class="controls">
      <button class="play" onclick="togglePlay()"></button>
    </div>
  </div>

  <script>
    let player;
    let isPlaying = false;

    // Funkcja wywoływana po załadowaniu IFrame API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0', // Ukryty odtwarzacz
        width: '0',
        videoId: 'WgC98YcxV60', // ID Twojego filmu
        playerVars: {
          start: 2454, // Rozpocznij od 2454 sekundy
          autoplay: 0, // 1 - automatyczne odtwarzanie
          controls: 0 // Brak widocznych kontrolek
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      console.log('Odtwarzacz gotowy!');
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        console.log('Wideo zakończone');
        stopSpinning();
      }
    }

    function togglePlay() {
      const button = document.querySelector('button');
      const vinyl = document.querySelector('.vinyl-img');

      if (isPlaying) {
        player.pauseVideo();
        stopSpinning();
        button.classList.remove('pause');
        button.classList.add('play');
        isPlaying = false;
      } else {
        player.playVideo();
        startSpinning();
        button.classList.remove('play');
        button.classList.add('pause');
        isPlaying = true;
      }
    }

    function startSpinning() {
      document.querySelector('.vinyl-img').classList.add('spinning');
    }

    function stopSpinning() {
      document.querySelector('.vinyl-img').classList.remove('spinning');
    }
  </script>
</body>
</html>
