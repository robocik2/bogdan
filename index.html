<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      transition: background-color 1s ease;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      cursor: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      if (currentImage) {
        resetCanvas(currentImage);
        startGrowth();
      }
    });
    
    let imageData;
    let activePixels = new Set();
    let animationFrame;
    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;
    let currentImage = null;

    // Function to get dominant color from image
    function getDominantColor(image) {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = image.width;
      tempCanvas.height = image.height;
      tempCtx.drawImage(image, 0, 0);
      
      const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const data = imageData.data;
      
      let colorCounts = {};
      let maxCount = 0;
      let dominantColor = { r: 0, g: 0, b: 0 };
      
      // Sample every 10th pixel for performance
      for (let i = 0; i < data.length; i += 40) {
        if (data[i + 3] > 128) { // Check if pixel is not too transparent
          const rgb = `${data[i]},${data[i + 1]},${data[i + 2]}`;
          colorCounts[rgb] = (colorCounts[rgb] || 0) + 1;
          
          if (colorCounts[rgb] > maxCount) {
            maxCount = colorCounts[rgb];
            dominantColor = { r: data[i], g: data[i + 1], b: data[i + 2] };
          }
        }
      }
      
      return dominantColor;
    }

    // Function to create complementary background color
    function getBackgroundColor(dominantColor) {
      const darkenFactor = 0.15; // Make background darker
      return {
        r: Math.floor(dominantColor.r * darkenFactor),
        g: Math.floor(dominantColor.g * darkenFactor),
        b: Math.floor(dominantColor.b * darkenFactor)
      };
    }
    
    canvas.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      loadRandomImage();
    });

    function getRandomImageNumber() {
      return Math.floor(Math.random() * 5) + 1;
    }

    function loadRandomImage() {
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.src = `${getRandomImageNumber()}.png`;
      
      img.onload = function() {
        currentImage = img;
        // Set background color based on image
        const dominantColor = getDominantColor(img);
        const bgColor = getBackgroundColor(dominantColor);
        document.body.style.backgroundColor = `rgb(${bgColor.r}, ${bgColor.g}, ${bgColor.b})`;
        
        resetCanvas(img);
        startGrowth();
      };
      
      img.onerror = function() {
        loadRandomImage();
      };
    }

    function resetCanvas(image) {
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const x = (canvas.width - 300) / 2;
      const y = (canvas.height - 300) / 2;
      
      ctx.drawImage(image, x, y, 300, 300);
      
      imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      activePixels.clear();
      const data = imageData.data;
      
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const idx = (y * canvas.width + x) * 4;
          if (data[idx + 3] > 0) {
            if (isEdgePixel(x, y, data)) {
              activePixels.add(`${x},${y}`);
            }
          }
        }
      }
    }

    function isEdgePixel(x, y, data) {
      const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      
      for (const [dx, dy] of directions) {
        const nx = x + dx;
        const ny = y + dy;
        
        if (nx >= 0 && nx < canvas.width && ny >= 0 && ny < canvas.height) {
          const idx = (ny * canvas.width + nx) * 4;
          if (data[idx + 3] === 0) {
            return true;
          }
        }
      }
      return false;
    }

    function startGrowth() {
      growthAnimation();
    }

    function getGrowthDirection(x, y) {
      const dx = mouseX - x;
      const dy = mouseY - y;
      const angle = Math.atan2(dy, dx);
      const randomFactor = 0.8; // Increased randomness for more organic growth
      return angle + (Math.random() - 0.5) * randomFactor;
    }

    function growthAnimation() {
      const newActivePixels = new Set();
      const data = imageData.data;
      
      for (const pixelKey of activePixels) {
        const [x, y] = pixelKey.split(',').map(Number);
        const idx = (y * canvas.width + x) * 4;
        
        if (Math.random() < 0.4) {
          const growthAngle = getGrowthDirection(x, y);
          // Increased growth distance for larger brushes
          const distance = 2 + Math.random() * 3;
          
          // Create multiple pixels per growth step for thicker brush
          for (let i = 0; i < 5; i++) {
            const spread = Math.random() * Math.PI * 2;
            const spreadDistance = Math.random() * 5; // Brush size
            
            const nx = Math.floor(x + Math.cos(growthAngle + spread) * (distance + spreadDistance));
            const ny = Math.floor(y + Math.sin(growthAngle + spread) * (distance + spreadDistance));
            
            if (nx >= 0 && nx < canvas.width && ny >= 0 && ny < canvas.height) {
              const newIdx = (ny * canvas.width + nx) * 4;
              
              if (data[newIdx + 3] === 0) {
                data[newIdx] = data[idx];
                data[newIdx + 1] = data[idx + 1];
                data[newIdx + 2] = data[idx + 2];
                data[newIdx + 3] = 255;
                
                newActivePixels.add(`${nx},${ny}`);
              }
            }
          }
        }
      }
      
      for (const pixel of newActivePixels) {
        activePixels.add(pixel);
      }
      
      ctx.putImageData(imageData, 0, 0);
      
      // Larger cursor indicator
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, 10, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      animationFrame = requestAnimationFrame(growthAnimation);
    }

    loadRandomImage();
  </script>
</body>
</html>
